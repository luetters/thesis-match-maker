<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – Thesis Match Maker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #76B900 0%, #5a8f00 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
    }

    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .status {
      background: #f5f5f5;
      border-left: 4px solid #76B900;
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff6b6b;
    }

    .status-indicator.online {
      background: #76B900;
    }

    button {
      background: #76B900;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
    }

    button:hover {
      background: #5a8f00;
    }

    button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #999;
    }

    @media (prefers-reduced-motion: no-preference) {
      .icon {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Keine Verbindung</h1>
    <p>Sie sind derzeit offline. Einige Funktionen sind nicht verfügbar.</p>

    <div class="status">
      <div class="status-item">
        <span class="status-indicator" id="connection-status"></span>
        <span id="connection-text">Verbindung wird überprüft...</span>
      </div>
    </div>

    <button onclick="location.reload()">Seite neu laden</button>

    <div class="footer">
      <p>Thesis Match Maker – HTW Berlin</p>
    </div>
  </div>

  <script>
    // Check connection status
    function updateConnectionStatus() {
      const indicator = document.getElementById("connection-status");
      const text = document.getElementById("connection-text");

      if (navigator.onLine) {
        indicator.classList.add("online");
        text.textContent = "Verbindung wiederhergestellt";
        setTimeout(() => {
          location.reload();
        }, 1000);
      } else {
        indicator.classList.remove("online");
        text.textContent = "Offline – Keine Internetverbindung";
      }
    }

    // Initial check
    updateConnectionStatus();

    // Listen for connection changes
    window.addEventListener("online", updateConnectionStatus);
    window.addEventListener("offline", updateConnectionStatus);

    // Periodic check
    setInterval(updateConnectionStatus, 3000);
  </script>
</body>
</html>
