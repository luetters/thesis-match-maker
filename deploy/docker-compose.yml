# ─── Thesis Match Maker – Docker Compose für IONOS VPS ──────────────────────
# Startet MySQL 8 + Node.js-Anwendung mit einem einzigen Befehl.
#
# Verwendung:
#   1. .env-Datei aus .env.example erstellen und ausfüllen
#   2. docker compose up -d --build
#   3. Datenbank-Migrationen ausführen (siehe Migrationsdokumentation)

version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: thesis_match
      MYSQL_USER: thesis
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://thesis:${MYSQL_PASSWORD}@db:3306/thesis_match
      JWT_SECRET: ${JWT_SECRET}
      SITE_URL: ${SITE_URL}
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-Thesis Match HTW Berlin <noreply@htw-berlin.de>}
      # Eigenständiger Scheduler (ersetzt Manus Heartbeat)
      SCHEDULER_ENABLED: "true"
      CRON_SECRET: ${CRON_SECRET}
      # Dateispeicher: lokal oder IONOS S3
      STORAGE_LOCAL_DIR: /app/storage-data
      # Optional: IONOS S3 (wenn gesetzt, wird lokaler Speicher ignoriert)
      # S3_ENDPOINT: https://s3.eu-central-1.ionoscloud.com
      # S3_BUCKET: thesis-match-storage
      # S3_REGION: de
      # S3_ACCESS_KEY: <Ihr IONOS S3 Access Key>
      # S3_SECRET_KEY: <Ihr IONOS S3 Secret Key>
      # 2FA-Verschlüsselung
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
    volumes:
      - storage_data:/app/storage-data

volumes:
  mysql_data:
  storage_data:

